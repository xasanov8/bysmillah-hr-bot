<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Application form to join the team" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23125c44'/%3E%3Cpath d='M11 9h6.2c2.6 0 4.3 1.3 4.3 3.4 0 1.4-.8 2.5-2.1 3 1.7.4 2.7 1.6 2.7 3.3 0 2.4-1.9 4.3-5 4.3H11z' fill='%23f4efe6'/%3E%3C/svg%3E"
    />
    <title>Bysmillah — Application</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <div class="header__brand">
          <p class="header__eyebrow" id="companyName"></p>
          <h1 class="header__title" id="appTitle"></h1>
        </div>
        <div class="header__actions">
          <nav class="langs" id="langs" aria-label="Language"></nav>
          <a class="staff-link" href="staff.html">Staff</a>
        </div>
      </div>

      <div class="steps" id="progress" aria-hidden="true"></div>
      <p class="header__step" id="stepLabel"></p>
    </header>

    <main id="main" class="main" aria-live="polite"></main>

    <footer class="footer" id="footer">
      <button type="button" class="btn btn--ghost" id="backBtn"></button>
      <button type="button" class="btn btn--primary" id="nextBtn"></button>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
